"fasta_ext": ".fasta.gz"
"fastq_ext": ".fastq.gz"
"fwd_fastq_sfx": "_1"
"rev_fastq_sfx": "_2"

"allowed_stage_list":
    - "raw_read_qc"
    - "raw_kmer_qc"
    - "filter_reads"
    - "mtdna"
    - "filtered_read_qc"
    - "read_contamination_scan"
    - "kmer_qc"
    - "smudgeplot" # smudgeplot requires a lot of memory to operate on mammalian size genomes (>700 Gbp of memory). Turn this analysis on only if you are sure you have enough memory. TODO: replace smudgeplot by external_tools consuming less memory.
    - "draft_qc"
    - "contig"
    - "dedup"
    - "hic_scaffolding"
    - "hic_alignment"
    - "polishing"
    - "ref_scaffolding"
    - "gap_closing"
    - "read_phasing"

"no_fasta_stage_list":
    - "check"
    - "raw_read_qc"
    - "raw_kmer_qc"
    - "filter_reads"
    - "filtered_read_qc"
    - "read_contamination_scan"
    - "gcp"
    - "kmer_qc"
    - "mtdna"
    - "read_phasing"

"skip_qc_fasta_stage_list":
    - "hic_alignment"

"assembly_initiating_stage_list":
    - "draft_qc"
    - "contig"

"tool_specific_features":
    "hifiasm":
        "options_affecting_error_correction":
            - "D"                               # -D
            - "N"                               # -N
            - "kmer_len"                        # -k
            - "window_size"                     # -w
            - "bloom_filter_bits"               # -f
            - "rounds_of_error_correction"      # -r
            - "length_of_adapters"              # -z
            - "max-kocc"                        # --max-kocc
            - "hg-size"                         # --hg-size
            - "ul-cut"                          # --ul-cut
            - "main_datatypes"
            - "ont_mode"
        "options_affecting_hic_phasing":
            - "seed"            # --seed
            - "s-base"          # --s-base
            - "n-weight"        # --n-weight
            - "n-perturb"       # --n-perturb
            - "f-perturb"       # --f-perturb
            - "l-misjoin"       # --l-msjoin
    "flye": []
    "nextdenovo": []

