#---- Main config file ----
"main_config_file": "config/core.yaml"      # Path to main config file relative to Snakefile
#--------------------------
#---- Resource profile ----
"resource_profile": "high"      # Should be present in resource directory
#--------------------------
#---- Conda settings ----
"use_existing_envs": True # works only if --use-conda flag was set in snakemake command
#----
#---- Container settings ----
"singularity_load_mode": "cluster" # Allowed: "cluster" or "conda". Set to conda to use singularity installed via conda. Sometimes doesn't work due to namespace issues due to cluster settings
"singularity_load_str": "module load singularity " # add version if necessary. Ignored if singularity_load_mode != "cluster"
"singularity_load_env": "common" # conda env to use if singularity_load_mode == "cluster"
#----
# "parameter_set":
# Choice of genome-size based set of parameters: threads, memory, running time and other tool options.
# Allowed:
#    - 'micro'  < 15 Mbp
#    - 'mini'   < 150 Mbp
#    - 'small'  < 500 Mbp, drosophilla, tetraodon, many other small fish
#    - 'normal' < 1500 Mbp, most of the birds
#    - 'big'    < 2500 Mbp, most of the mammals
#    - 'large'  < 5000 Mbp, human
#    - 'giant'  < 15000 Mbp, large plant, shark, amphibian genomes
#    - 'titan'  > 15000 Mbp, large plant genomes, pine trees, never tested
"parameter_set": "normal"

#---- Data ----
"input_datatypes": "hifi,hic,illumina,reference"
"data_filtering":
    - "hifi"
    - "hic"
    - "illumina"
    - "nanopore"

"assembly_kmer_length":
    - 31 # kmer length to be used for phasing hic reads using assembled and purge_dupsed contigs
"phasing_stage": "polishing"
#-------- Options specific for starting point 'draft' ----------------
"phasing_kmer_length": 31 # set 'NA' if you wish to use unphased reads # TODO: check if it is obsolete
#---------------------------------------------------------------------

"final_kmer_counter": "meryl" # pipeline allows usage of different kmer counter external_tools, but only one genomesize assessment could be used
"final_kmer_length": 21 # pipeline allows usage of different kmer length, but only one genomesize assessment could be used

"final_kmer_datatypes":
    - "hifi"
    #- "illumina"

#----
#---- Stage settings ----
"stage_list": # 'draft_qc' and 'contig' are mutually exclusive stages
    - "raw_read_qc" # comment this stage if you wish to skip quality control of the raw data
    #- "raw_kmer_qc" # runs kmer counting and genome size estimation from raw reads. Usually you don't need it
    - "filter_reads" #
    - "filtered_read_qc"
    - "kmer_qc"
    #- "mtdna"
    - "read_contamination_scan" # TODO: test after refactoring
    #- "draft_qc"         # SELECT EITHER 'contig' or 'draft_qc'. This stages actually initiate assembly process
    - "contig"            # SELECT EITHER 'contig' or 'draft_qc'. This stages actually initiate assembly process
    - "polishing"        # MUST NOT PRECEDE 'contig' or 'draft_qc' stages
    - "dedup"             # MUST NOT PRECEDE 'contig' or 'draft_qc' stages # TODO: do more testing for hapsolo
    - "hic_alignment"     # MUST NOT PRECEDE 'contig' or 'draft_qc' stages
    - "hic_scaffolding"   # MUST FOLLOW hic_alignment stage
    #- "ref_scaffolding"   # MUST NOT PRECEDE 'contig' or 'draft_qc' stages # TODO: do more testing , at moment it requires telomere detection
    #- "gap_closing"      # MUST NOT PRECEDE 'contig' or 'draft_qc' stages
    #- "read_phasing" # this is an attached stage, it is attached to the stage set by "phasing_stage" parameter. However, if phased reads are required for any other stage, the corresponding rules will be called automatically. Uncomment it only if you need to get phased reads for all suitable datatypes.

"stage_coretools":
    "contig": # Allowed: "hifiasm". TODO: "nextdenovo"
        - "hifiasm"
        #- "flye"
        #- "nextdenovo" #TODO: implement
    "hic_alignment":
        - "arima"
        #- "bwa_only"
        #- "pairtools"
        #- "juicer"
        #- "pore-c"
        #- "cifi"
    "hic_scaffolding": # Allowed: "yahs", "3d-dna"
        - "yahs"
        #- "threeddna"
    "ref_scaffolding":
        - "ragtag"
    "polishing":
        - "nextpolish2"
    "dedup":
        - "hapsolo"
        #- "purge_dups"
    "gap_closing":
        - "samba"
    "draft_qc":
        - "draft_qc"

