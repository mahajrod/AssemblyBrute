#---- Main config file ----
"main_config_file": "config/core.yaml"      # Path to main config file relative to Snakefile
#--------------------------
#---- Resource profile ----
"resource_profile": "high"      # Should be present in resource directory
#--------------------------


'alternative_tmp_dir': None

"stage_coretools":     #TODO: add bionano
    "filtering":
        "hifi": "cutadapt"
        "illumina": "cutadapt"
    "contig":
        "hifi":
            - "hifiasm" # Allowed: "hifiasm". TODO: "hicanu", "ipa", "flye", "nextdenovo"
        #"clr":
        #"nanopore":
    "purge_dups":
        "default":
            - "purge_dups"
    "hic_scaffolding":
        "default":
            #- "salsa2" # Allowed: "salsa2", "yahs", "3d-dna"
            - "yahs"
            #- "threeddna"
    "curation":
        "default":
            - "curation"
    "ref_scaffolding":
        "default":
            - "ragtag"
    "polishing":
        "default":
            - "nextpolish2"
    "dedup":
        "default":
            - "hapsolo"
    "draft_qc":
        "default":
            - "assembly_qc"
    "gap_closing":
        "default":
            - "samba"

"extended_qc_stages":
    #- "purge_dups"
    - "hic_scaffolding"
    - "ref_scaffolding"
    - "dedup"
    - "draft_qc"
    #- "contig"

"qc_settings":
    "windows_sets":
        #- "w1000k.s1000k"
        #- "w1000k.s100k"
        #- "w100k.s100k"
        - "w100k.s10k"
        - "w10k.s10k"
    "reference_scaffold_sets":
        - "custom"
        #- "long"
        #- "middle"
        #- "short"
        #- "micro"
    "assembly_scaffold_sets":
        - "long"
        #- "middle"
        #- "short"
        #- "micro"
    "threshold_types":
        - "absolute"
        - "relative"

"coretool_option_sets":
    "hifiasm":
         #- "l0primary"
         - "l1primary"
         #- "l2primary"
         #- "l3primary"
         #- "l1primary_no_hic"
         #- "repeat_enhanced_l1"
         #- "repeat_enhanced_l2"
    "purge_dups":
        #- "default"
        - "skipped"
    "salsa2":
        - "phased_reads"
        #- "unphased_reads"
    "yahs":
        - "phased_reads"
        #- "unphased_reads"
    "threeddna":
        - "phased_reads"
        #- "unphased_reads"
    "curation":
        - "default"
    "nextpolish2":
        - "default"
    "hapsolo":
        - "default"
        #- "skipped"
    "assembly_qc":
        - "default"
    "samba":
        - "phased_reads"

"other_tool_option_sets": # Options set here overwrite settings from "secondary_tool_config_file". Check it for configurable option list
    "mapping_pipeline":         "arima"  # Allowed: arima, bwa_only, pairtools.

"tool_manually_adjusted_features":
    "calcuts": # I recommend to check cutoffs created by calcuts after purge_dups step and adjust them according to distributions
        "lower_threshold": null #
        "haploid_diploid_threshold": null #
        "upper_threshold": null #
    "hifiasm":
        "coverage_estimator": null
        "lambda": 36
    "krater":
        "use_second_peak": null
        "low_limit": null
        "high_limit": null
    "genomescope":
        "starting_lambda": 30
        "start_shift": null
    "hapsolo":
        "busco_lineage_list":
            #- "actinopterygii_odb10"
            - "actinopterygii_odb12"
            #- "actinopterygii_odb12.2"

"ploidy": 2
"bwa_tool": "bwa-mem2" # Allowed: bwa, bwa-mem2
"genome_prefix": "fGadMor7.1" #"YGG048.GadMorReseq"
"busco_lineage_list":
    - "actinopterygii_odb10"
    - "actinopterygii_odb12"
    #- "vertebrata_odb10" #
#Often used BUSCO lineages: mammalia_odb10, vertebrata_odb10, laurasiatheria_odb10, carnivora_odb10,
#                           actinopterygii_odb10, saccharomycetes_odb10, sauropsida_odb10, aves_odb10
"telomere_motif": "CCCTAA"  # telomere motif at 5'-end; CCCTAA for human, place null if unknown
"species_name": "Gadus morhua"
"tax_id": 8049 # # necessary for contamination scan via FCS
"bird_genome": False

"kingdom": "animal"  # "animal", "plant" or "fungi"
"mitoz_clade": "Chordata" #Allowed: {Chordata,Arthropoda,Echinodermata,Annelida-segmented-worms,Bryozoa,Mollusca,Nematoda,Nemertea-ribbon-worms,Porifera-sponges}
"mtdna_genetic_code":  2 # Organism genetic code should be one from the NCBI table:
                         #  1. The Standard Code
                         #  2. The Vertebrate MitochondrialCode
                         #  3.  The Yeast Mitochondrial Code
                         #  4.  The Mold,Protozoan, and Coelenterate Mitochondrial Code and the Mycoplasma/Spiroplasma Code
                         #  5.  The Invertebrate Mitochondrial Code
                         #  6.  The Ciliate, Dasycladacean and Hexamita Nuclear Code
                         #  9.  The Echinoderm and Flatworm Mitochondrial Code
                         # 10. The Euplotid Nuclear Code
                         # 11. The Bacterial, Archaeal and Plant Plastid Code
                         # 12. The Alternative Yeast Nuclear Code
                         # 13. The Ascidian Mitochondrial Code
                         # 14. The Alternative Flatworm Mitochondrial Code
                         # 16. Chlorophycean Mitochondrial Code
                         # 21. Trematode Mitochondrial Code
                         # 22. Scenedesmus obliquus Mitochondrial Code
                         # 23. Thraustochytrium Mitochondrial Code
                         # 24. Pterobranchia Mitochondrial Code
                         # 25. Candidate Division SR1 and Gracilibacteria Code

"database_set":
    "kraken2":
        - "nt"                      # configure corresonding entry in "allowed_databases"
    "fcs_adaptor":
        - "adaptor"
    "fcs":
        - "fcs_gx"

"filtered_data": []

"final_kmer_counter": "meryl" # pipeline allows usage of different kmer counter external_tools, but only one genomesize assessment could be used
"final_kmer_length": 21 # pipeline allows usage of different kmer length, but only one genomesize assessment could be used

"final_kmer_datatypes":
    - "illumina"

"assembly_kmer_length":
    - 31 # kmer length to be used for phasing hic reads using assembled and purge_dupsed contigs
"phasing_stage": "draft_qc"

"contig_datatype": "hifi"
"hic_enzyme_set": "Arima"
"custom_enzyme_set": null # None
"custom_enzyme_set_is_no_motif": False

"starting_point": "draft" # Allowed: "draft"
"data_types": "hifi,illumina,hic,reference" # TODO: add  "hifi,lr,bionano,hic", "hifi,lr,hic"  and "hifi" and others

#-------- Options specific for starting point 'draft' ----------------
"phasing_kmer_length": 31 # set 'NA' if you wish to use unphased reads
#---------------------------------------------------------------------

"mode": "qc"                # Allowed: "preprocessing", "qc", "assembly"
"preprocessing_mode": "default"   # Allowed: "default"
"qc_mode": "default"              # Allowed: "default"
"assembly_mode": "polished_contig_hic_scaffolding_dedup"#"hic_scaffolding"           # Allowed: "default", "full", "purge_dups", "contig"; custom modes could be set in config file

"custom_preprocessing_stages": []
"custom_qc_stages": []
"custom_assembly_stages": []


"skip_read_qc": True
"skip_filter_reads": True
"skip_busco": False
"skip_fcs": True
"skip_fcs_adaptor": True
"skip_kraken": True
"skip_phasing": False
"skip_prescaf_pretext": False
"skip_postscaf_pretext": True
"skip_both_pretext": False
"skip_nanoqc": False
"skip_nanoplot": False
"skip_wga": False
"skip_higlass": True
"skip_variantcalling": True
"skip_hic_file": True
"skip_krater": True
"skip_ragtag": True

"skip_mtdna": True
"skip_mitohifi_reads": True
"skip_mitohifi_reads_per_file": True
"skip_mitohifi_reads_combined": True
"skip_mitohifi_assembly": True

"skip_mitoz": True
"skip_mitoz_hic": True
"skip_mitoz_illumina": True

"create_hic_file_during_curation": False

#------------------------------------------------------
#"adaptor_scan": True
#"fcs_gx_scan": True
# Allowed modes:
#       with starting_point "fastq":
#           "check_input"              : check of the input data and generation of the final config
#           "qc"                       : "check_input" + QC
#           "filtering"                : "qc" + filtering of the input data
#           "contig"                   : "filtering" + contig assembly
#           "purge_dups"               : "contig" + purging of haplotype duplicates
#           "hic_scaffolding"          : "purge_dups" + HiC-scaffolding
#           "full"                     : same as "hic_scaffolding"
#       with starting_point "draft":
#           "purge_dups"               : purging of haplotype duplicates from draft assembly
#           "hic_scaffolding"          : "purge_dups" + HiC-scaffolding


# TODO:  add modes:  "create_map_bionano", "bionano_scaffolding"

"parameter_set": "normal" # Choice of genome-size based set of parameters
"use_existing_envs": True # works only if --use-conda flag was set in snakemake command
