         #- "l2"
         #- "l3"
         #- "l1_no_hic"
         #- "l1_3p"
         #- "l1_no_ul"
         #- "l1_main_nano_only"
         #- "rep_enh_l1"
         #- "rep_enh_l2"
    "flye":
        - "hifi"
        #- "hifi_keep_hap"
        #- "hifi_keep_hap_scaf"
        #- "hifi_no_alt_contigs"
        #- "hifi_no_alt_contigs_scaf"
        #- "hifi_scaff"
        #- "old_nano"
        #- "nano_corr"
        #- "nano_hq"
    "purge_dups":
